name: Publicar en Instagram

on:
  schedule:
    # Dos despertares por hora, de 06 a 21 UTC —de 08:00 a 23:00 en Madrid, y
    # con el cambio de hora sigue cubriendo la franja útil—. Antes eran seis
    # horas sueltas calculadas a mano para las tres franjas de DiviFriends;
    # con varias cuentas, cada una con sus horas en cuentas.json, esa lista
    # había que rehacerla cada vez que entraba una marca, y olvidarla
    # significaba que esa cuenta no publicaba nunca.
    #
    # publish.py solo saca lo que ya ha vencido, así que despertar de más no
    # publica nada antes de tiempo: solo cuesta un minuto de Actions. Son 32
    # ejecuciones al día sobre las ~66 que da el plan gratuito de un repo
    # privado, con sitio de sobra.
    #
    # Los minutos son :07 y :37, no el minuto en punto, a propósito. Los
    # workflows programados van con la prioridad más baja y el atasco gordo es
    # a las en punto, que es cuando dispara el cron de medio mundo. Pedir turno
    # unos minutos después del pico se salta esa cola.
    - cron: "7,37 6-21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo enseñar qué se publicaría"
        type: boolean
        default: false
      verificar:
        description: "Solo comprobar que las credenciales llegan a la API"
        type: boolean
        default: false

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests

      - name: Publicar lo que toque
        env:
          # Qué cuenta es cada cosa está en cuentas.json, que va en el repo:
          # los ids de Instagram son públicos. Aquí solo viaja el secreto.
          #
          # Un mismo token de usuario del sistema vale para todas las cuentas
          # cuyos activos tenga asignados. Una cuenta de cliente con token
          # propio se añade aquí como IG_ACCESS_TOKEN_<SLUG en mayúsculas>.
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TZ_LOCAL: Europe/Madrid
        run: |
          python3 scripts/publish.py \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.verificar && '--verificar' || '' }}

      - name: Guardar el estado de la cola
        if: ${{ !inputs.dry_run && !inputs.verificar }}
        run: |
          if git diff --quiet -- cola.csv; then
            echo "Sin cambios en la cola."
            exit 0
          fi
          git config user.name  "ig-autopost"
          git config user.email "ig-autopost@users.noreply.github.com"
          git add cola.csv
          git commit -m "cola: publicaciones del $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
