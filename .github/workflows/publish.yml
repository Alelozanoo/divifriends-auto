name: Publicar en Instagram

on:
  schedule:
    # Cada 15 min, pero solo en las franjas en las que publicamos (UTC: en
    # verano España va +2). Despertar 96 veces al día gastaría 2.880 minutos
    # de Actions al mes —GitHub redondea cada ejecución a un minuto entero— y
    # el plan gratis de un repo privado son 2.000. Así se queda en ~1.100.
    # GitHub puede retrasar el cron unos minutos cuando hay carga.
    # Publicamos a las 11:00, 16:00 y 21:00 de Madrid = 09/14/19 UTC en verano.
    # Se abre una hora antes y después por si GitHub retrasa el disparo.
    - cron: "*/15 8-10,13-15,18-20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo enseñar qué se publicaría"
        type: boolean
        default: false

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests

      - name: Publicar lo que toque
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TZ_LOCAL: Europe/Madrid
        run: |
          python3 scripts/publish.py \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Guardar el estado de la cola
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- cola.csv; then
            echo "Sin cambios en la cola."
            exit 0
          fi
          git config user.name  "ig-autopost"
          git config user.email "ig-autopost@users.noreply.github.com"
          git add cola.csv
          git commit -m "cola: publicaciones del $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
