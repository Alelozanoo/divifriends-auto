name: Publicar en Instagram

on:
  schedule:
    # Cada 15 min, pero solo en las franjas en las que publicamos. El cron va
    # en UTC y Madrid cambia de hora, así que cada franja necesita DOS horas:
    #
    #   franja   verano (+2)   invierno (+1)
    #   11:00      09 UTC         10 UTC
    #   16:00      14 UTC         15 UTC
    #   21:00      19 UTC         20 UTC
    #
    # La segunda hora de cada par hace doble papel: en verano es el margen por
    # si GitHub retrasa el disparo, y en invierno es la hora buena. No quitar
    # ninguna de las seis pensando que sobra.
    #
    # La hora ANTERIOR a cada franja sí sobraba y se ha quitado: publish.py
    # solo publica lo que ya ha vencido, así que despertarse antes no hacía
    # nada. Eso baja de 36 a 24 despertares al día.
    #
    # GitHub redondea cada ejecución a un minuto entero y el plan gratis de un
    # repo privado son 2.000 al mes (~66 al día): con 24 hay sitio de sobra
    # aunque algún run se pase del minuto.
    #
    # Los minutos son :05 :20 :35 :50 y NO el minuto en punto, a propósito.
    # Los workflows programados son best-effort: van con la prioridad más baja
    # y el atasco gordo es a las en punto, que es cuando dispara el cron de
    # medio mundo. Con */15 el 16 de agosto se lanzaron 6 de 12 disparos y
    # ninguno cayó en su minuto (18:49, 19:20, 19:44, 19:58, 20:32, 20:58 UTC).
    # Pedir turno cinco minutos después del pico se salta esa cola.
    - cron: "5,20,35,50 9,10,14,15,19,20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo enseñar qué se publicaría"
        type: boolean
        default: false
      verificar:
        description: "Solo comprobar que las credenciales llegan a la API"
        type: boolean
        default: false

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests

      - name: Publicar lo que toque
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TZ_LOCAL: Europe/Madrid
        run: |
          python3 scripts/publish.py \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.verificar && '--verificar' || '' }}

      - name: Guardar el estado de la cola
        if: ${{ !inputs.dry_run && !inputs.verificar }}
        run: |
          if git diff --quiet -- cola.csv; then
            echo "Sin cambios en la cola."
            exit 0
          fi
          git config user.name  "ig-autopost"
          git config user.email "ig-autopost@users.noreply.github.com"
          git add cola.csv
          git commit -m "cola: publicaciones del $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
